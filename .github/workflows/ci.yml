name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Until the Android project is scaffolded there's nothing to build.
      # Drop these hashFiles conditions once the Gradle wrapper is committed.
      - uses: actions/setup-java@v6
        if: hashFiles('gradlew') != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        if: hashFiles('gradlew') != ''

      - name: Build
        if: hashFiles('gradlew') != ''
        run: ./gradlew build
